<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labeling Queue — Review Trust Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:         #020617;
            --surface:    #0F172A;
            --surface-2:  #1E293B;
            --border:     rgba(148, 163, 184, 0.12);
            --text:       #F8FAFC;
            --text-muted: #94A3B8;
            --primary:    #38BDF8;
            --real:       #22C55E;
            --real-bg:    rgba(34, 197, 94, 0.08);
            --fake:       #EF4444;
            --fake-bg:    rgba(239, 68, 68, 0.08);
            --skip:       #64748B;
            --amber:      #F59E0B;
        }

        body {
            font-family: 'Fira Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* ── Sidebar ─────────────────────────────── */
        .sidebar {
            width: 220px;
            min-height: 100vh;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 1.5rem 1rem;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 10;
        }

        .sidebar-brand {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-mark {
            font-family: 'Fira Code', monospace;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .sidebar-name {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-top: 0.125rem;
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .nav-links a {
            display: flex;
            align-items: center;
            gap: 0.625rem;
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: background 0.15s, color 0.15s;
            cursor: pointer;
        }

        .nav-links a:hover {
            background: var(--surface-2);
            color: var(--text);
        }

        .nav-links a.active {
            background: rgba(56, 189, 248, 0.1);
            color: var(--primary);
        }

        .nav-links svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        /* ── Main ────────────────────────────────── */
        .main {
            margin-left: 220px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ── Page Header ─────────────────────────── */
        .page-header {
            position: sticky;
            top: 0;
            z-index: 5;
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 0.875rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .page-title { flex: 1; }

        .page-title h1 {
            font-size: 0.9375rem;
            font-weight: 600;
            color: var(--text);
        }

        .page-title p {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.1rem;
        }

        .stat-pill {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 0.3rem 0.875rem;
            min-width: 72px;
        }

        .stat-pill-label {
            font-size: 0.6rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .stat-pill-value {
            font-family: 'Fira Code', monospace;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
        }

        .stat-pill-value.danger { color: var(--fake); }

        /* ── Content ─────────────────────────────── */
        .content {
            padding: 1.25rem 1.5rem;
            flex: 1;
        }

        /* ── Task Grid ───────────────────────────── */
        .task-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1rem;
        }

        /* ── Task Card ───────────────────────────── */
        .task-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: border-color 0.2s, box-shadow 0.2s, opacity 0.25s, transform 0.25s;
            position: relative;
        }

        .task-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
        }

        .task-card.pre-real::before      { background: var(--real); }
        .task-card.pre-suspicious::before { background: var(--fake); }
        .task-card.pre-unknown::before   { background: var(--amber); }

        .task-card:hover {
            border-color: rgba(56, 189, 248, 0.25);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
        }

        .task-card.dismissing {
            opacity: 0;
            transform: scale(0.96) translateY(-6px);
            pointer-events: none;
        }

        .card-body {
            padding: 0.875rem 1rem 0.875rem 1.25rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.625rem;
        }

        .card-meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .source-id {
            font-family: 'Fira Code', monospace;
            font-size: 0.7rem;
            color: var(--text-muted);
            background: var(--surface-2);
            padding: 0.125rem 0.5rem;
            border-radius: 0.25rem;
        }

        .pre-label-badge {
            display: flex;
            align-items: center;
            gap: 0.2rem;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 0.1rem 0.5rem;
            border-radius: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .pre-label-badge.real       { background: var(--real-bg); color: var(--real);  border: 1px solid rgba(34,197,94,0.2); }
        .pre-label-badge.suspicious { background: var(--fake-bg); color: var(--fake);  border: 1px solid rgba(239,68,68,0.2); }
        .pre-label-badge.unknown    { background: rgba(245,158,11,0.08); color: var(--amber); border: 1px solid rgba(245,158,11,0.2); }

        .review-author-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .review-stars { color: #FBBF24; letter-spacing: 1px; }

        .review-text {
            font-family: 'Fira Code', monospace;
            font-size: 0.775rem;
            line-height: 1.65;
            color: #CBD5E1;
            background: rgba(0, 0, 0, 0.25);
            padding: 0.75rem;
            border-radius: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 5;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* ── Action Buttons ──────────────────────── */
        .card-actions {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 0.5rem;
            padding: 0.75rem 1rem 0.75rem 1.25rem;
            border-top: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.15);
        }

        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.375rem;
            padding: 0.625rem 0.5rem;
            border-radius: 0.5rem;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.15s;
            min-height: 44px;
            font-family: 'Fira Sans', sans-serif;
            letter-spacing: 0.3px;
        }

        .action-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

        .btn-real {
            background: var(--real-bg);
            color: var(--real);
            border-color: rgba(34, 197, 94, 0.25);
        }
        .btn-real:hover { background: var(--real); color: #000; border-color: var(--real); }

        .btn-fake {
            background: var(--fake-bg);
            color: var(--fake);
            border-color: rgba(239, 68, 68, 0.25);
        }
        .btn-fake:hover { background: var(--fake); color: #fff; border-color: var(--fake); }

        .btn-skip {
            background: transparent;
            color: var(--skip);
            border-color: var(--border);
            padding: 0.625rem 0.75rem;
            font-size: 0.75rem;
        }
        .btn-skip:hover { background: var(--surface-2); color: var(--text-muted); }

        /* ── Empty State ─────────────────────────── */
        .empty-state {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
            gap: 0.75rem;
        }

        .empty-state svg { width: 40px; height: 40px; opacity: 0.35; }
        .empty-state p { font-size: 0.9rem; }

        /* ── Load More ───────────────────────────── */
        .actions-row {
            padding: 1.25rem 1.5rem;
            display: flex;
            justify-content: center;
        }

        .load-more-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.625rem 1.5rem;
            background: var(--surface);
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            min-height: 44px;
            font-family: 'Fira Sans', sans-serif;
        }

        .load-more-btn:hover {
            background: var(--surface-2);
            color: var(--text);
            border-color: rgba(56, 189, 248, 0.3);
        }

        .load-more-btn svg { width: 16px; height: 16px; }

        /* ── Toast ───────────────────────────────── */
        #toast-container {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .toast {
            padding: 0.75rem 1.25rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            color: white;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.2s, transform 0.2s;
            pointer-events: none;
            font-family: 'Fira Sans', sans-serif;
        }

        .toast.show    { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .toast.error   { background: var(--fake); }
        .toast.success { background: var(--real); color: #000; }
        .toast.info    { background: var(--primary); color: #000; }

        /* ── Responsive ──────────────────────────── */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                min-height: auto;
                position: relative;
                flex-direction: row;
                align-items: center;
                padding: 0.75rem 1rem;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .sidebar-brand {
                margin-bottom: 0;
                padding-bottom: 0;
                border-bottom: none;
                border-right: 1px solid var(--border);
                padding-right: 1rem;
                margin-right: 1rem;
            }
            .sidebar-name { display: none; }
            .nav-links { flex-direction: row; gap: 0.25rem; }
            .main { margin-left: 0; }
            body { flex-direction: column; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }

        :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    </style>
</head>

<body>
    <!-- Sidebar -->
    <nav class="sidebar" aria-label="Main navigation">
        <div class="sidebar-brand">
            <div class="sidebar-mark">RTA</div>
            <div class="sidebar-name">Review Trust Analyzer</div>
        </div>
        <ul class="nav-links" role="list">
            <li>
                <a href="/">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                    </svg>
                    Single Analysis
                </a>
            </li>
            <li>
                <a href="/places">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>
                    </svg>
                    Place Analysis
                </a>
            </li>
            <li>
                <a href="/admin/labeling" class="active" aria-current="page">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                    </svg>
                    Labeling Queue
                </a>
            </li>
        </ul>
    </nav>

    <!-- Main content -->
    <div class="main">
        <!-- Sticky header -->
        <header class="page-header">
            <div class="page-title">
                <h1>Labeling Queue</h1>
                <p>Review edge cases and pre-labeled data</p>
            </div>
            <div class="stat-pill">
                <span class="stat-pill-label">API Credits</span>
                <span class="stat-pill-value" id="api-credits">—</span>
            </div>
            <div class="stat-pill">
                <span class="stat-pill-label">Pending</span>
                <span class="stat-pill-value" id="pending-count">0</span>
            </div>
        </header>

        <!-- Task grid -->
        <div class="content">
            <div id="tasks-container" class="task-grid" role="list" aria-label="Labeling tasks">
                <!-- Cards injected by JS -->
            </div>
        </div>

        <div class="actions-row">
            <button class="load-more-btn" onclick="fetchPendingTasks()" aria-label="Load more cases">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                Load More Cases
            </button>
        </div>
    </div>

    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script>
        function showToast(message, type = 'error') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('show'));
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 200);
            }, 4000);
        }

        async function fetchPendingTasks() {
            try {
                const response = await fetch('/api/labeling/pending?limit=10');
                if (!response.ok) throw new Error('Failed to fetch tasks');
                const tasks = await response.json();
                document.getElementById('pending-count').textContent =
                    tasks.length > 0 ? tasks.length + '+' : '0';
                renderTasks(tasks);
            } catch (error) {
                console.error(error);
                showToast('Error loading tasks. See console.');
            }
        }

        function renderTasks(tasks) {
            const container = document.getElementById('tasks-container');
            container.innerHTML = '';

            if (tasks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" role="status">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                            <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <p>Queue is clear — no pending tasks.</p>
                    </div>`;
                return;
            }

            tasks.forEach(task => {
                const content = task.content_json || {};
                const text    = content.text || 'No text content';
                const author  = content.author || 'Anonymous';
                const stars   = '★'.repeat(content.rating || 0) + '☆'.repeat(5 - (content.rating || 0));

                const preLabel = task.pre_label || 'unknown';
                const confidence = task.pre_confidence != null
                    ? ` ${(task.pre_confidence * 100).toFixed(0)}%`
                    : '';

                const card = document.createElement('div');
                card.className = `task-card pre-${preLabel}`;
                card.id = `task-${task.id}`;
                card.setAttribute('role', 'listitem');
                card.innerHTML = `
                    <div class="card-body">
                        <div class="card-meta-row">
                            <span class="source-id">${task.source_id.substring(0, 12)}…</span>
                            <span class="pre-label-badge ${preLabel}">${preLabel}${confidence}</span>
                        </div>
                        <div class="review-author-row">
                            <span>${author}</span>
                            <span class="review-stars" aria-label="${content.rating || 0} stars">${stars}</span>
                        </div>
                        <div class="review-text">"${text}"</div>
                    </div>
                    <div class="card-actions">
                        <button class="action-btn btn-real" onclick="submitLabel(${task.id}, 'real')" aria-label="Label as real">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
                            Real
                        </button>
                        <button class="action-btn btn-fake" onclick="submitLabel(${task.id}, 'suspicious')" aria-label="Label as fake">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                            Fake
                        </button>
                        <button class="action-btn btn-skip" onclick="submitLabel(${task.id}, 'skip', 'skipped')" aria-label="Skip this review">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/></svg>
                        </button>
                    </div>`;
                container.appendChild(card);
            });
        }

        async function submitLabel(taskId, label, status = 'labeled') {
            try {
                const response = await fetch(`/api/labeling/${taskId}/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ human_label: label, status })
                });

                if (response.ok) {
                    const card = document.getElementById(`task-${taskId}`);
                    card.classList.add('dismissing');
                    setTimeout(() => {
                        card.remove();
                        const remaining = document.querySelectorAll('.task-card').length;
                        if (remaining === 0) renderTasks([]);
                    }, 280);
                    if (label !== 'skip') {
                        showToast(
                            label === 'real' ? 'Labeled as Real' : 'Labeled as Fake',
                            label === 'real' ? 'success' : 'error'
                        );
                    }
                } else {
                    showToast('Submit failed — check API.');
                }
            } catch (error) {
                console.error(error);
                showToast('Error submitting label.');
            }
        }

        async function fetchApiUsage() {
            try {
                const resp = await fetch('/api/serpapi/usage');
                const data = await resp.json();
                const creditsElem = document.getElementById('api-credits');
                if (creditsElem) {
                    const limit = data.plan_searches_left || data.searches_per_month || 0;
                    creditsElem.textContent = limit;
                    creditsElem.classList.toggle('danger', limit < 10);
                }
            } catch (e) {
                console.error(e);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchPendingTasks();
            fetchApiUsage();
        });
    </script>
</body>

</html>
