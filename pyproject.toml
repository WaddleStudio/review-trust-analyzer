[project]
name = "review-trust-analyzer"
version = "0.2.0"
description = "AI-powered review trust analysis system using NLP and ML to detect suspicious reviews"
authors = [
    {name = "Review Trust Team"}
]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["nlp", "machine-learning", "sentiment-analysis", "review-analysis", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi",
    "uvicorn",
    "sqlmodel",
    "psycopg2-binary",
    "scikit-learn",
    "pandas",
    "numpy",
    "pytest",
    "requests",
    "httpx",
    "python-multipart",
    "pydantic-settings",
    "aiofiles",
    "textblob",
    "sentence-transformers",
    "tenacity>=9.1.4",
    "discord-py>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
    "pre-commit",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "features*", "ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = [
    "--verbose",
    "--strict-markers",
    "-ra",
]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
